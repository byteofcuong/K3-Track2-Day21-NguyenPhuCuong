# Sieu tham so cho mo hinh RandomForestClassifier
# Thay doi cac gia tri nay giua cac lan chay de thi nghiem (Buoc 1)
# Bo sieu tham so tot nhat chon tu 5 thi nghiem o Buoc 1 (xem BAOCAO.md)
# Bonus 2: random_forest | gradient_boosting | logistic_regression
model_type: random_forest

n_estimators: 500
max_depth: null
min_samples_split: 2

# Nguong chat luong cho eval gate trong CI/CD.
# 0.65 cho Buoc 2 (2998 mau, tran thuc nghiem 0.684); nang len 0.70 o Buoc 3 (5996 mau).
eval_threshold: 0.65
